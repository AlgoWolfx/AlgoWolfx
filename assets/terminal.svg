<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Terminal: Yiğit Osman Bayrak, Full Stack Software Engineer">
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace; }
    .art  { font-size: 12.8px; fill: #E2461A; font-weight: 700; }
    .cmd  { font-size: 15px; fill: #e6edf3; }
    .ps   { fill: #3fb950; font-weight: 700; }
    .out  { font-size: 15px; fill: #8b949e; }
    .hi   { fill: #e6edf3; font-weight: 700; }
    .acc  { fill: #E2461A; font-weight: 700; }

    @keyframes rise   { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes type   { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes show   { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink  { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .a1 { animation: rise .35s ease-out .10s both; }
    .a2 { animation: rise .35s ease-out .18s both; }
    .a3 { animation: rise .35s ease-out .26s both; }
    .a4 { animation: rise .35s ease-out .34s both; }
    .a5 { animation: rise .35s ease-out .42s both; }
    .a6 { animation: rise .35s ease-out .50s both; }

    .c1 { animation: type .6s steps(14) 1.0s both; }
    .o1 { animation: show .3s ease-out 1.7s both; }
    .c2 { animation: type .7s steps(19) 2.2s both; }
    .o2 { animation: show .3s ease-out 3.0s both; }
    .c3 { animation: type .5s steps(15) 3.5s both; }
    .o3 { animation: show .3s ease-out 4.1s both; }
    .c4 { animation: type .5s steps(15) 4.6s both; }
    .o4 { animation: show .3s ease-out 5.2s both; }
    .p5 { animation: show .1s linear 5.8s both; }
    .cursor { animation: show .1s linear 5.8s both, blink 1.1s steps(1) 5.9s infinite; }
  </style>

